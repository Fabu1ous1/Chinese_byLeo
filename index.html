<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>汉语 · Первые иероглифы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Spectral:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap');
  body { margin: 0; background: #1B1B20; }
  .hanzi-font { font-family: 'Noto Serif SC', serif; }
  .display-font { font-family: 'Spectral', serif; }
  .ui-font { font-family: 'Inter', sans-serif; }
  .flip-card { perspective: 1200px; }
  .flip-inner { transition: transform 0.5s; transform-style: preserve-3d; }
  .flip-inner.flipped { transform: rotateY(180deg); }
  .flip-face { backface-visibility: hidden; }
  .flip-back { transform: rotateY(180deg); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const { useState, useEffect, useMemo } = React;

const LESSONS = [
  { id: 1, title: "Приветствия", words: [
    { hanzi: "你", pinyin: "nǐ", tone: 3, ru: "ты" },
    { hanzi: "你好", pinyin: "nǐ hǎo", tone: 3, ru: "привет" },
    { hanzi: "谢谢", pinyin: "xièxie", tone: 4, ru: "спасибо" },
    { hanzi: "再见", pinyin: "zàijiàn", tone: 4, ru: "до свидания" },
    { hanzi: "是", pinyin: "shì", tone: 4, ru: "быть, да" },
    { hanzi: "不", pinyin: "bù", tone: 4, ru: "не, нет" },
    { hanzi: "我", pinyin: "wǒ", tone: 3, ru: "я" },
    { hanzi: "他", pinyin: "tā", tone: 1, ru: "он" },
  ]},
  { id: 2, title: "Числа", words: [
    { hanzi: "一", pinyin: "yī", tone: 1, ru: "один" },
    { hanzi: "二", pinyin: "èr", tone: 4, ru: "два" },
    { hanzi: "三", pinyin: "sān", tone: 1, ru: "три" },
    { hanzi: "四", pinyin: "sì", tone: 4, ru: "четыре" },
    { hanzi: "五", pinyin: "wǔ", tone: 3, ru: "пять" },
    { hanzi: "六", pinyin: "liù", tone: 4, ru: "шесть" },
    { hanzi: "七", pinyin: "qī", tone: 1, ru: "семь" },
    { hanzi: "八", pinyin: "bā", tone: 1, ru: "восемь" },
  ]},
  { id: 3, title: "Люди и семья", words: [
    { hanzi: "人", pinyin: "rén", tone: 2, ru: "человек" },
    { hanzi: "家", pinyin: "jiā", tone: 1, ru: "дом, семья" },
    { hanzi: "朋友", pinyin: "péngyou", tone: 2, ru: "друг" },
    { hanzi: "老师", pinyin: "lǎoshī", tone: 3, ru: "учитель" },
    { hanzi: "学生", pinyin: "xuésheng", tone: 2, ru: "ученик" },
    { hanzi: "妈妈", pinyin: "māma", tone: 1, ru: "мама" },
    { hanzi: "爸爸", pinyin: "bàba", tone: 4, ru: "папа" },
    { hanzi: "孩子", pinyin: "háizi", tone: 2, ru: "ребёнок" },
  ]},
  { id: 4, title: "Еда и быт", words: [
    { hanzi: "吃", pinyin: "chī", tone: 1, ru: "есть (кушать)" },
    { hanzi: "喝", pinyin: "hē", tone: 1, ru: "пить" },
    { hanzi: "水", pinyin: "shuǐ", tone: 3, ru: "вода" },
    { hanzi: "茶", pinyin: "chá", tone: 2, ru: "чай" },
    { hanzi: "米饭", pinyin: "mǐfàn", tone: 3, ru: "рис (блюдо)" },
    { hanzi: "大", pinyin: "dà", tone: 4, ru: "большой" },
    { hanzi: "小", pinyin: "xiǎo", tone: 3, ru: "маленький" },
    { hanzi: "喜欢", pinyin: "xǐhuan", tone: 3, ru: "нравиться" },
  ]},
  { id: 5, title: "Время и дни", words: [
    { hanzi: "今天", pinyin: "jīntiān", tone: 1, ru: "сегодня" },
    { hanzi: "明天", pinyin: "míngtiān", tone: 2, ru: "завтра" },
    { hanzi: "昨天", pinyin: "zuótiān", tone: 2, ru: "вчера" },
    { hanzi: "现在", pinyin: "xiànzài", tone: 4, ru: "сейчас" },
    { hanzi: "时间", pinyin: "shíjiān", tone: 2, ru: "время" },
    { hanzi: "早上", pinyin: "zǎoshang", tone: 3, ru: "утро" },
    { hanzi: "晚上", pinyin: "wǎnshang", tone: 3, ru: "вечер" },
    { hanzi: "星期", pinyin: "xīngqī", tone: 1, ru: "неделя" },
  ]},
  { id: 6, title: "Действия", words: [
    { hanzi: "去", pinyin: "qù", tone: 4, ru: "идти, ехать" },
    { hanzi: "来", pinyin: "lái", tone: 2, ru: "приходить" },
    { hanzi: "看", pinyin: "kàn", tone: 4, ru: "смотреть" },
    { hanzi: "说", pinyin: "shuō", tone: 1, ru: "говорить" },
    { hanzi: "听", pinyin: "tīng", tone: 1, ru: "слушать" },
    { hanzi: "做", pinyin: "zuò", tone: 4, ru: "делать" },
    { hanzi: "想", pinyin: "xiǎng", tone: 3, ru: "хотеть, думать" },
    { hanzi: "有", pinyin: "yǒu", tone: 3, ru: "иметь" },
  ]},
];

const ALL_WORDS = LESSONS.flatMap((l) => l.words.map((w) => ({ ...w, lesson: l.id })));
const TONE_LABEL = { 1: "1-й, ровный", 2: "2-й, восходящий", 3: "3-й, падающе-восходящий", 4: "4-й, падающий" };

function ToneMark({ tone, size = 22, color = "#A6332B" }) {
  const paths = {
    1: "M2 11 H20",
    2: "M2 17 Q11 3 20 3",
    3: "M2 6 Q7 20 11 11 Q15 3 20 17",
    4: "M2 3 Q11 3 20 19",
  };
  return React.createElement("svg", { width: size, height: size, viewBox: "0 0 22 22", fill: "none" },
    React.createElement("path", { d: paths[tone] || paths[1], stroke: color, strokeWidth: "2.4", strokeLinecap: "round" })
  );
}

function Seal({ learned, total }) {
  return (
    <div className="relative flex flex-col items-center justify-center border-4 rounded-sm"
      style={{ borderColor: "#A6332B", color: "#A6332B", width: 64, height: 64, transform: "rotate(-3deg)", fontFamily: "'Noto Serif SC', serif" }}>
      <span className="text-lg font-bold leading-none">{learned}</span>
      <span className="text-[10px] leading-none mt-1 opacity-70">/ {total}</span>
    </div>
  );
}

function ChineseApp() {
  const [learned, setLearned] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [lessonId, setLessonId] = useState(1);
  const [mode, setMode] = useState("learn");
  const [index, setIndex] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [quizWord, setQuizWord] = useState(null);
  const [quizOptions, setQuizOptions] = useState([]);
  const [quizAnswer, setQuizAnswer] = useState(null);

  const words = useMemo(() => LESSONS.find((l) => l.id === lessonId).words, [lessonId]);
  const totalLearned = Object.keys(learned).filter((k) => learned[k]).length;

  useEffect(() => {
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
    } catch (e) {}
  }, []);

  useEffect(() => {
    try {
      const saved = localStorage.getItem("chinese_progress");
      if (saved) setLearned(JSON.parse(saved));
    } catch (e) {}
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    try {
      localStorage.setItem("chinese_progress", JSON.stringify(learned));
    } catch (e) {}
  }, [learned, loaded]);

  useEffect(() => {
    setIndex(0);
    setFlipped(false);
  }, [lessonId, mode]);

  useEffect(() => {
    if (mode !== "quiz") return;
    const w = words[index % words.length];
    const wrongPool = ALL_WORDS.filter((x) => x.hanzi !== w.hanzi);
    const wrongs = [];
    while (wrongs.length < 3 && wrongPool.length) {
      const pick = wrongPool[Math.floor(Math.random() * wrongPool.length)];
      if (!wrongs.find((x) => x.hanzi === pick.hanzi)) wrongs.push(pick);
    }
    const opts = [w, ...wrongs].sort(() => Math.random() - 0.5);
    setQuizWord(w);
    setQuizOptions(opts);
    setQuizAnswer(null);
  }, [mode, index, lessonId]);

  const markLearned = (hanzi) => setLearned((prev) => ({ ...prev, [hanzi]: true }));
  const next = () => { setFlipped(false); setIndex((i) => (i + 1) % words.length); };
  const w = words[index % words.length];

  return (
    <div className="min-h-screen w-full" style={{ background: "#1B1B20", color: "#E8E1CF" }}>
      <div className="max-w-md mx-auto px-5 pt-8 pb-16">
        <header className="flex items-start justify-between mb-6">
          <div>
            <p className="ui-font text-xs tracking-widest uppercase opacity-60 mb-1">汉语 · с нуля</p>
            <h1 className="display-font text-2xl italic" style={{ color: "#E8E1CF" }}>Первые иероглифы</h1>
          </div>
          <Seal learned={totalLearned} total={ALL_WORDS.length} />
        </header>

        <nav className="flex gap-2 mb-5 overflow-x-auto">
          {LESSONS.map((l) => (
            <button key={l.id} onClick={() => setLessonId(l.id)}
              className="ui-font text-xs px-3 py-1.5 rounded-full whitespace-nowrap border transition-colors"
              style={lessonId === l.id ? { background: "#A6332B", borderColor: "#A6332B", color: "#E8E1CF" } : { borderColor: "#4A4A52", color: "#B8B3A5" }}>
              {l.id}. {l.title}
            </button>
          ))}
        </nav>

        <div className="flex gap-2 mb-6">
          {[{ id: "learn", label: "Учить" }, { id: "quiz", label: "Тест" }].map((m) => (
            <button key={m.id} onClick={() => setMode(m.id)}
              className="ui-font text-sm flex-1 py-2 rounded-md border transition-colors"
              style={mode === m.id ? { background: "#B8933E", borderColor: "#B8933E", color: "#1B1B20", fontWeight: 600 } : { borderColor: "#4A4A52", color: "#B8B3A5" }}>
              {m.label}
            </button>
          ))}
        </div>

        {mode === "learn" && (
          <div>
            <div className="flip-card mb-5" onClick={() => setFlipped((f) => !f)}>
              <div className={"flip-inner relative rounded-lg cursor-pointer " + (flipped ? "flipped" : "")} style={{ height: 260 }}>
                <div className="flip-face absolute inset-0 rounded-lg flex flex-col items-center justify-center gap-3" style={{ background: "#E8E1CF", color: "#1B1B20" }}>
                  <span className="hanzi-font text-7xl">{w.hanzi}</span>
                  <div className="flex items-center gap-2">
                    <ToneMark tone={w.tone} />
                    <span className="ui-font text-sm opacity-60">{TONE_LABEL[w.tone]}</span>
                  </div>
                  <p className="ui-font text-xs opacity-50 mt-2">нажми, чтобы перевернуть</p>
                </div>
                <div className="flip-face flip-back absolute inset-0 rounded-lg flex flex-col items-center justify-center gap-2" style={{ background: "#A6332B", color: "#E8E1CF" }}>
                  <span className="display-font italic text-2xl">{w.pinyin}</span>
                  <span className="ui-font text-lg">{w.ru}</span>
                </div>
              </div>
            </div>

            <div className="flex gap-2">
              <button onClick={() => markLearned(w.hanzi)} className="ui-font flex-1 py-2.5 rounded-md text-sm font-medium"
                style={{ background: learned[w.hanzi] ? "#4F6F62" : "transparent", border: "1px solid #4F6F62", color: learned[w.hanzi] ? "#E8E1CF" : "#4F6F62" }}>
                {learned[w.hanzi] ? "Выучено ✓" : "Отметить выученным"}
              </button>
              <button onClick={next} className="ui-font px-5 py-2.5 rounded-md text-sm font-medium" style={{ background: "#E8E1CF", color: "#1B1B20" }}>
                Далее →
              </button>
            </div>

            <p className="ui-font text-xs text-center mt-4 opacity-50">{(index % words.length) + 1} / {words.length} в этом уроке</p>
          </div>
        )}

        {mode === "quiz" && quizWord && (
          <div>
            <div className="rounded-lg flex flex-col items-center justify-center gap-2 mb-5" style={{ background: "#E8E1CF", color: "#1B1B20", height: 180 }}>
              <span className="hanzi-font text-6xl">{quizWord.hanzi}</span>
              <span className="display-font italic text-lg opacity-60">{quizWord.pinyin}</span>
            </div>
            <p className="ui-font text-xs uppercase tracking-widest opacity-60 mb-2">Что это значит?</p>
            <div className="flex flex-col gap-2 mb-5">
              {quizOptions.map((opt) => {
                const isCorrect = opt.hanzi === quizWord.hanzi;
                const showState = quizAnswer !== null;
                let style = { borderColor: "#4A4A52", color: "#E8E1CF" };
                if (showState && isCorrect) style = { background: "#4F6F62", borderColor: "#4F6F62", color: "#E8E1CF" };
                else if (showState && opt.hanzi === quizAnswer && !isCorrect) style = { background: "#A6332B", borderColor: "#A6332B", color: "#E8E1CF" };
                return (
                  <button key={opt.hanzi} disabled={showState}
                    onClick={() => {
                      setQuizAnswer(opt.hanzi);
                      if (isCorrect) markLearned(quizWord.hanzi);
                      try {
                        window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback &&
                        window.Telegram.WebApp.HapticFeedback.notificationOccurred(isCorrect ? "success" : "error");
                      } catch (e) {}
                    }}
                    className="ui-font text-left px-4 py-3 rounded-md border text-sm" style={style}>
                    {opt.ru}
                  </button>
                );
              })}
            </div>
            {quizAnswer !== null && (
              <button onClick={next} className="ui-font w-full py-2.5 rounded-md text-sm font-medium" style={{ background: "#E8E1CF", color: "#1B1B20" }}>
                Следующий вопрос →
              </button>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ChineseApp />);

</script>
</body>
</html>
