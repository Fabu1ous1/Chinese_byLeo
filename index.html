<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>汉语 · Первые иероглифы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Spectral:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #1B1B20;
    color: #E8E1CF;
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 420px; margin: 0 auto; padding: 32px 20px 64px; }
  .hanzi { font-family: 'Noto Serif SC', serif; }
  .display { font-family: 'Spectral', serif; font-style: italic; }

  header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.6; margin: 0 0 4px; }
  h1 { font-size: 24px; margin: 0; }
  .seal {
    width: 64px; height: 64px; border: 4px solid #A6332B; color: #A6332B;
    border-radius: 4px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; transform: rotate(-3deg); font-family: 'Noto Serif SC', serif;
    flex-shrink: 0;
  }
  .seal b { font-size: 18px; line-height: 1; }
  .seal span { font-size: 10px; line-height: 1; margin-top: 4px; opacity: 0.7; }

  nav { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
  nav button {
    font-family: 'Inter', sans-serif; font-size: 12px; padding: 7px 14px; border-radius: 999px;
    white-space: nowrap; border: 1px solid #4A4A52; background: transparent; color: #B8B3A5;
  }
  nav button.active { background: #A6332B; border-color: #A6332B; color: #E8E1CF; }

  .modes { display: flex; gap: 8px; margin-bottom: 24px; }
  .modes button {
    flex: 1; font-size: 14px; padding: 10px; border-radius: 8px; border: 1px solid #4A4A52;
    background: transparent; color: #B8B3A5; font-family: 'Inter', sans-serif;
  }
  .modes button.active { background: #B8933E; border-color: #B8933E; color: #1B1B20; font-weight: 600; }

  .flip-card { perspective: 1200px; margin-bottom: 20px; height: 310px; cursor: pointer; }
  .flip-inner { position: relative; width: 100%; height: 100%; transition: transform 0.5s; transform-style: preserve-3d; }
  .flip-inner.flipped { transform: rotateY(180deg); }
  .flip-face {
    position: absolute; inset: 0; border-radius: 10px; backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding: 16px;
  }
  .flip-front { background: #E8E1CF; color: #1B1B20; }
  .flip-back { background: #A6332B; color: #E8E1CF; transform: rotateY(180deg); }
  .flip-front .char { font-size: 60px; }
  .tone-row { display: flex; align-items: center; gap: 8px; }
  .tone-row span { font-size: 13px; opacity: 0.6; }
  .hint { font-size: 12px; opacity: 0.5; margin-top: 4px; }
  .flip-back .pinyin { font-size: 22px; }
  .flip-back .ru { font-size: 17px; }
  .example {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(232,225,207,0.25);
    text-align: center; width: 100%;
  }
  .example .ex-hanzi { font-family: 'Noto Serif SC', serif; font-size: 18px; display: block; margin-bottom: 4px; }
  .example .ex-pinyin { font-family: 'Spectral', serif; font-style: italic; font-size: 13px; opacity: 0.85; display: block; }
  .example .ex-ru { font-size: 12px; opacity: 0.7; display: block; margin-top: 2px; }

  .row { display: flex; gap: 8px; }
  .btn-outline {
    flex: 1; padding: 11px; border-radius: 8px; font-size: 14px; font-weight: 500;
    background: transparent; border: 1px solid #4F6F62; color: #4F6F62; font-family: 'Inter', sans-serif;
  }
  .btn-outline.done { background: #4F6F62; color: #E8E1CF; }
  .btn-solid {
    padding: 11px 20px; border-radius: 8px; font-size: 14px; font-weight: 500;
    background: #E8E1CF; color: #1B1B20; border: none; font-family: 'Inter', sans-serif;
  }
  .counter { text-align: center; font-size: 12px; opacity: 0.5; margin-top: 16px; }

  .quiz-card {
    border-radius: 10px; background: #E8E1CF; color: #1B1B20; height: 180px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px;
  }
  .quiz-card .char { font-size: 56px; font-family: 'Noto Serif SC', serif; }
  .quiz-card .pinyin { font-size: 18px; opacity: 0.6; }
  .quiz-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; opacity: 0.6; margin-bottom: 8px; }
  .options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .opt {
    text-align: left; padding: 12px 16px; border-radius: 8px; font-size: 14px;
    border: 1px solid #4A4A52; background: transparent; color: #E8E1CF; font-family: 'Inter', sans-serif;
  }
  .opt.correct { background: #4F6F62; border-color: #4F6F62; color: #E8E1CF; }
  .opt.wrong { background: #A6332B; border-color: #A6332B; color: #E8E1CF; }
  .next-btn { width: 100%; padding: 11px; border-radius: 8px; font-size: 14px; font-weight: 500; background: #E8E1CF; color: #1B1B20; border: none; font-family: 'Inter', sans-serif; }

  .g-list { display: flex; flex-direction: column; gap: 8px; }
  .g-item {
    text-align: left; padding: 14px 16px; border-radius: 10px; border: 1px solid #4A4A52;
    background: transparent; color: #E8E1CF; font-family: 'Inter', sans-serif;
  }
  .g-item .g-num { font-family: 'Noto Serif SC', serif; color: #B8933E; font-size: 13px; margin-right: 8px; }
  .g-item .g-title { font-size: 14px; font-weight: 500; }
  .g-back { background: none; border: none; color: #B8933E; font-family: 'Inter', sans-serif; font-size: 13px; padding: 0; margin-bottom: 16px; }
  .g-detail-title { font-size: 20px; margin: 0 0 12px; }
  .g-explain { font-size: 14px; line-height: 1.6; opacity: 0.9; margin-bottom: 16px; }
  .g-formula {
    background: #E8E1CF; color: #1B1B20; padding: 12px 16px; border-radius: 8px;
    font-family: 'Spectral', serif; font-style: italic; font-size: 15px; margin-bottom: 20px; text-align: center;
  }
  .g-ex-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; opacity: 0.6; margin-bottom: 10px; }
  .g-example { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #33333a; }
  .g-example:last-child { border-bottom: none; }
  .g-ex-hanzi { font-family: 'Noto Serif SC', serif; font-size: 20px; display: block; margin-bottom: 2px; }
  .g-ex-pinyin { font-family: 'Spectral', serif; font-style: italic; font-size: 13px; opacity: 0.75; display: block; }
  .g-ex-ru { font-size: 13px; opacity: 0.6; display: block; margin-top: 2px; }
  .g-practice {
    margin-top: 24px; padding-top: 20px; border-top: 1px solid #4A4A52;
  }
  .g-practice-q { font-size: 14px; margin-bottom: 12px; font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">汉语 · с нуля</p>
      <h1 class="display">Первые иероглифы</h1>
    </div>
    <div class="seal"><b id="sealCount">0</b><span id="sealTotal">/ 80</span></div>
  </header>

  <nav id="lessonNav"></nav>

  <div class="modes">
    <button id="modeLearnBtn" class="active">Учить</button>
    <button id="modeQuizBtn">Тест</button>
    <button id="modeGrammarBtn">Грамматика</button>
  </div>

  <div id="learnView">
    <div class="flip-card" id="flipCard">
      <div class="flip-inner" id="flipInner">
        <div class="flip-face flip-front">
          <span class="char hanzi" id="fCharFront"></span>
          <div class="tone-row"><svg id="toneSvg" width="22" height="22" viewBox="0 0 22 22" fill="none"></svg><span id="toneLabel"></span></div>
          <p class="hint">нажми, чтобы перевернуть</p>
        </div>
        <div class="flip-face flip-back">
          <span class="pinyin display" id="fPinyin"></span>
          <span class="ru" id="fRu"></span>
          <div class="example">
            <span class="ex-hanzi hanzi" id="fExHanzi"></span>
            <span class="ex-pinyin" id="fExPinyin"></span>
            <span class="ex-ru" id="fExRu"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <button class="btn-outline" id="markBtn">Отметить выученным</button>
      <button class="btn-solid" id="nextBtn">Далее →</button>
    </div>
    <p class="counter" id="counter"></p>
  </div>

  <div id="quizView" style="display:none;">
    <div class="quiz-card">
      <span class="char" id="qChar"></span>
      <span class="pinyin display" id="qPinyin"></span>
    </div>
    <p class="quiz-label">Что это значит?</p>
    <div class="options" id="qOptions"></div>
    <button class="next-btn" id="qNextBtn" style="display:none;">Следующий вопрос →</button>
  </div>

  <div id="grammarView" style="display:none;">
    <div id="gList" class="g-list"></div>
    <div id="gDetail" style="display:none;">
      <button class="g-back" id="gBackBtn">← Все темы</button>
      <h2 class="g-detail-title display" id="gTitle"></h2>
      <p class="g-explain" id="gExplain"></p>
      <div class="g-formula" id="gFormula"></div>
      <p class="g-ex-label">Примеры</p>
      <div id="gExamples"></div>
      <div class="g-practice">
        <p class="g-practice-q" id="gPracticeQ"></p>
        <div class="options" id="gPracticeOpts"></div>
      </div>
    </div>
  </div>
</div>

const ALL_WORDS = LESSONS.flatMap(l => l.words);
const TONE_LABEL = { 0: "нейтральный", 1: "1-й, ровный", 2: "2-й, восходящий", 3: "3-й, падающе-восходящий", 4: "4-й, падающий" };
const TONE_PATH = {
  0: "M2 11 H20",
  1: "M2 11 H20",
  2: "M2 17 Q11 3 20 3",
  3: "M2 6 Q7 20 11 11 Q15 3 20 17",
  4: "M2 3 Q11 3 20 19",
};

let learned = {};
try {
  const saved = localStorage.getItem("chinese_progress");
  if (saved) learned = JSON.parse(saved);
} catch (e) {}

let lessonId = 1;
let mode = "learn";
let index = 0;
let flipped = false;
let quizWord = null;
let quizAnswered = false;

function saveProgress() {
  try { localStorage.setItem("chinese_progress", JSON.stringify(learned)); } catch (e) {}
}

function currentWords() {
  return LESSONS.find(l => l.id === lessonId).words;
}

function updateSeal() {
  const count = Object.keys(learned).filter(k => learned[k]).length;
  document.getElementById("sealCount").textContent = count;
  document.getElementById("sealTotal").textContent = "/ " + ALL_WORDS.length;
}

function renderNav() {
  const nav = document.getElementById("lessonNav");
  nav.innerHTML = "";
  LESSONS.forEach(l => {
    const b = document.createElement("button");
    b.textContent = l.id + ". " + l.title;
    if (l.id === lessonId) b.classList.add("active");
    b.onclick = () => { lessonId = l.id; index = 0; flipped = false; renderNav(); renderLearn(); renderQuiz(true); };
    nav.appendChild(b);
  });
}

  document.getElementById("fExPinyin").textContent = w.exPinyin || "";
  document.getElementById("fExRu").textContent = w.exRu || "";
  document.getElementById("toneLabel").textContent = TONE_LABEL[w.tone];
  document.getElementById("toneSvg").innerHTML =
    '<path d="' + (TONE_PATH[w.tone] || TONE_PATH[1]) + '" stroke="#A6332B" stroke-width="2.4" stroke-linecap="round"/>';
  document.getElementById("flipInner").classList.remove("flipped");
  flipped = false;
  const markBtn = document.getElementById("markBtn");
  if (learned[w.hanzi]) { markBtn.textContent = "Выучено ✓"; markBtn.classList.add("done"); }
  else { markBtn.textContent = "Отметить выученным"; markBtn.classList.remove("done"); }
  document.getElementById("counter").textContent = ((index % words.length) + 1) + " / " + words.length + " в этом уроке";
  updateSeal();
}

function renderQuiz(reset) {
  if (mode !== "quiz") return;
  const words = currentWords();
  const w = words[index % words.length];
  quizWord = w;
  quizAnswered = false;
  document.getElementById("qChar").textContent = w.hanzi;
  document.getElementById("qPinyin").textContent = w.pinyin;

  const wrongPool = ALL_WORDS.filter(x => x.hanzi !== w.hanzi);
  const wrongs = [];
  while (wrongs.length < 3 && wrongPool.length) {
    const pick = wrongPool[Math.floor(Math.random() * wrongPool.length)];
    if (!wrongs.find(x => x.hanzi === pick.hanzi)) wrongs.push(pick);
  }
  const opts = [w, ...wrongs].sort(() => Math.random() - 0.5);

  const optsDiv = document.getElementById("qOptions");
  optsDiv.innerHTML = "";
  opts.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.textContent = opt.ru;
    btn.onclick = () => {
      if (quizAnswered) return;
      quizAnswered = true;
      const isCorrect = opt.hanzi === w.hanzi;
      if (isCorrect) { learned[w.hanzi] = true; saveProgress(); updateSeal(); }
      [...optsDiv.children].forEach(child => {
        child.disabled = true;
      });
      if (isCorrect) btn.classList.add("correct");
      else {
        btn.classList.add("wrong");
        [...optsDiv.children].find(c => c.textContent === w.ru).classList.add("correct");
      }
      try {
        window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback &&
        window.Telegram.WebApp.HapticFeedback.notificationOccurred(isCorrect ? "success" : "error");
      } catch (e) {}
      document.getElementById("qNextBtn").style.display = "block";
    };
    optsDiv.appendChild(btn);
  });
  document.getElementById("qNextBtn").style.display = "none";
  updateSeal();
}

document.getElementById("flipCard").onclick = () => {
  flipped = !flipped;
  document.getElementById("flipInner").classList.toggle("flipped", flipped);
};

document.getElementById("markBtn").onclick = () => {
  const words = currentWords();
  const w = words[index % words.length];
  learned[w.hanzi] = true;
  saveProgress();
  renderLearn();
};

document.getElementById("nextBtn").onclick = () => {
  const words = currentWords();
  index = (index + 1) % words.length;
  renderLearn();
};

document.getElementById("qNextBtn").onclick = () => {
  const words = currentWords();
  index = (index + 1) % words.length;
  renderQuiz();
};

document.getElementById("modeLearnBtn").onclick = () => {
  mode = "learn";
  setActiveModeBtn("modeLearnBtn");
  document.getElementById("learnView").style.display = "block";
  document.getElementById("quizView").style.display = "none";
  document.getElementById("grammarView").style.display = "none";
  document.getElementById("lessonNav").style.display = "flex";
  index = 0;
  renderLearn();
};

document.getElementById("modeQuizBtn").onclick = () => {
  mode = "quiz";
  setActiveModeBtn("modeQuizBtn");
  document.getElementById("learnView").style.display = "none";
  document.getElementById("quizView").style.display = "block";
  document.getElementById("grammarView").style.display = "none";
  document.getElementById("lessonNav").style.display = "flex";
  index = 0;
  renderQuiz();
};

document.getElementById("modeGrammarBtn").onclick = () => {
  mode = "grammar";
  setActiveModeBtn("modeGrammarBtn");
  document.getElementById("learnView").style.display = "none";
  document.getElementById("quizView").style.display = "none";
  document.getElementById("grammarView").style.display = "block";
  document.getElementById("lessonNav").style.display = "none";
  showGrammarList();
};

function setActiveModeBtn(id) {
  ["modeLearnBtn", "modeQuizBtn", "modeGrammarBtn"].forEach(b => document.getElementById(b).classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function showGrammarList() {
  document.getElementById("gList").style.display = "flex";
  document.getElementById("gDetail").style.display = "none";
  const list = document.getElementById("gList");
  list.innerHTML = "";
  GRAMMAR.forEach(g => {
    const btn = document.createElement("button");
    btn.className = "g-item";
    btn.innerHTML = '<span class="g-num hanzi">' + String(g.id).padStart(2, "0") + '</span><span class="g-title">' + g.title + '</span>';
    btn.onclick = () => showGrammarDetail(g.id);
    list.appendChild(btn);
  });
}

function showGrammarDetail(id) {
  const g = GRAMMAR.find(x => x.id === id);
  document.getElementById("gList").style.display = "none";
  document.getElementById("gDetail").style.display = "block";
  document.getElementById("gTitle").textContent = g.title;
  document.getElementById("gExplain").textContent = g.explain;
  document.getElementById("gFormula").textContent = g.formula;

  const exDiv = document.getElementById("gExamples");
  exDiv.innerHTML = "";
  g.examples.forEach(ex => {
    const d = document.createElement("div");
    d.className = "g-example";
    d.innerHTML =
      '<span class="g-ex-hanzi">' + ex.hanzi + '</span>' +
      '<span class="g-ex-pinyin">' + ex.pinyin + '</span>' +
      '<span class="g-ex-ru">' + ex.ru + '</span>';
    exDiv.appendChild(d);
  });

  document.getElementById("gPracticeQ").textContent = g.practice.q;
  const optsDiv = document.getElementById("gPracticeOpts");
  optsDiv.innerHTML = "";
  let answered = false;
  g.practice.opts.forEach((optText, i) => {
    const btn = document.createElement("button");
    btn.className = "opt hanzi";
    btn.textContent = optText;
    btn.onclick = () => {
      if (answered) return;
      answered = true;
      [...optsDiv.children].forEach(c => c.disabled = true);
      if (i === g.practice.correct) btn.classList.add("correct");
      else {
        btn.classList.add("wrong");
        optsDiv.children[g.practice.correct].classList.add("correct");
      }
      try {
        window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback &&
        window.Telegram.WebApp.HapticFeedback.notificationOccurred(i === g.practice.correct ? "success" : "error");
      } catch (e) {}
    };
    optsDiv.appendChild(btn);
  });
}

document.getElementById("gBackBtn").onclick = showGrammarList;

renderNav();
renderLearn();
</script>
</body>
</html>
